name: Build AAB + APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-and-publish
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app from base64
        run: |
          base64 -d appcode.b64 > app.zip
          rm -rf app
          unzip -o app.zip
      - name: Point FCM to org.bne Firebase app
        run: |
          sed -i 's#android:b71e1156b884ab9bc49b4d#android:104350403e81ae6cc49b4d#' app/lib/main.dart
          echo "--- FCM appId ---"; grep -n "appId" app/lib/main.dart || true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create platform folders (org.bne package)
        working-directory: app
        run: flutter create --org org.bne --platforms=android,web .
      - name: Brand app name and icon (BNEOne)
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="BNEOne"#' $M
          grep -n 'android:label' $M
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          logo = Image.open('assets/logo.png').convert('RGBA')
          bb = logo.getchannel('A').point(lambda a: 255 if a > 20 else 0).getbbox() or (0, 0, *logo.size)
          c = logo.crop(bb); s = max(c.size)
          sq = Image.new('RGBA', (s, s), (0, 0, 0, 0)); sq.paste(c, ((s - c.size[0]) // 2, (s - c.size[1]) // 2))
          for d, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              ic = Image.new('RGBA', (px, px), (255, 255, 255, 255))
              inner = round(px * 0.92); ic.alpha_composite(sq.resize((inner, inner), Image.LANCZOS), ((px - inner) // 2, (px - inner) // 2))
              ic.convert('RGB').save(f'android/app/src/main/res/mipmap-{d}/ic_launcher.png')
              print('icon', d, px)
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
      - name: Add Android permissions
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' $M
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' $M
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' $M
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA"/>' $M
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' $M
          sed -i '/<manifest/a\    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>' $M
          # on-duty location tracking: foreground service of type "location" (no background-location permission needed)
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android"#<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"#' $M
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' $M
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>' $M
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.WAKE_LOCK"/>' $M
          sed -i 's#</application>#        <service android:name="id.flutter.flutter_background_service.BackgroundService" android:foregroundServiceType="location" tools:replace="android:foregroundServiceType"/>\n    </application>#' $M
          sed -i 's#</application>#        <meta-data android:name="com.google.android.geo.API_KEY" android:value="AIzaSyDXbBy28hjRVV3tHgXAJQSgiPMo5j3Y06w"/>\n    </application>#' $M
          sed -i 's#</head>#  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC_OjH0aLXnZBvzKldqZpUwackrI7DVlbc"></script>\n</head>#' web/index.html
          # ML Kit text recognition references optional language packs we don't ship — tell R8 not to fail on them
          printf '%s\n' '-dontwarn com.google.mlkit.vision.text.chinese.**' '-dontwarn com.google.mlkit.vision.text.devanagari.**' '-dontwarn com.google.mlkit.vision.text.japanese.**' '-dontwarn com.google.mlkit.vision.text.korean.**' >> android/app/proguard-rules.pro
          echo "--- manifest ---"; cat $M
      - name: Notifications (buzzer sound, channels, desugaring)
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/raw
          if [ -f notif/buzzer.wav ]; then
            cp notif/buzzer.wav android/app/src/main/res/raw/buzzer.wav
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@raw/buzzer" />' > android/app/src/main/res/raw/keep.xml
          fi
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.VIBRATE"/>' $M
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' $M
          sed -i 's#</application>#        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="bne_general_v1"/>\n    </application>#' $M
          python3 - <<'PY'
          import os
          p = 'android/app/build.gradle.kts'
          if os.path.exists(p):
              s = open(p).read()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              p = 'android/app/build.gradle'
              s = open(p).read()
              if 'coreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          open(p, 'w').write(s)
          print('--- desugaring patched in', p, '---'); print(s[-600:])
          PY
          ls -la android/app/src/main/res/raw
      - name: Configure release signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$PWD/android/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$PWD/android/upload.jks
          EOF
          python3 - <<'PY'
          import os
          p = 'android/app/build.gradle.kts'
          groovy = not os.path.exists(p)
          if groovy:
              p = 'android/app/build.gradle'
          s = open(p).read()
          if not groovy:
              header = (
                  'import java.util.Properties\n'
                  'import java.io.FileInputStream\n\n'
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              sign = (
                  '\n    signingConfigs {\n'
                  '        create("upload") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                  '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
                  '            storePassword = keystoreProperties["storePassword"] as String\n'
                  '        }\n'
                  '    }\n'
              )
              s = header + s
              s = s.replace('android {', 'android {' + sign, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("upload")')
          else:
              header = (
                  'def keystoreProperties = new Properties()\n'
                  'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              sign = (
                  '\n    signingConfigs {\n'
                  '        upload {\n'
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "            storeFile file(keystoreProperties['storeFile'])\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  '        }\n'
                  '    }\n'
              )
              s = header + s
              s = s.replace('android {', 'android {' + sign, 1)
              s = s.replace('signingConfig signingConfigs.debug',
                            'signingConfig signingConfigs.upload')
          open(p, 'w').write(s)
          print('--- patched', p, '---')
          print(s[:900])
          PY
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Build signed App Bundle (.aab)
        working-directory: app
        run: flutter build appbundle --release --build-number=${GITHUB_RUN_NUMBER} --build-name=1.0.${GITHUB_RUN_NUMBER}
      - name: Build signed APK
        working-directory: app
        run: flutter build apk --release --build-number=${GITHUB_RUN_NUMBER} --build-name=1.0.${GITHUB_RUN_NUMBER}
      - name: Publish AAB + APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish to Play internal testing
        id: play1
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.bne.salesman_tracker
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
      # While another release is in review, Play refuses auto-review; retry holding changes for manual send
      - name: Publish to Play internal testing (changes held for review)
        id: play2
        if: steps.play1.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.bne.salesman_tracker
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          changesNotSentForReview: true
      # Last try after a pause (Play "edit expired" is usually a short-lived clash)
      - name: Wait before final Play retry
        if: steps.play1.outcome == 'failure' && steps.play2.outcome == 'failure'
        run: sleep 45
      - name: Publish to Play internal testing (final retry)
        if: steps.play1.outcome == 'failure' && steps.play2.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.bne.salesman_tracker
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
      - name: Build web (app + admin dashboard)
        working-directory: app
        run: |
          flutter build web --release --base-href /salesman-tracker/
          cp ../admin.html build/web/admin.html
          cp ../privacy.html build/web/privacy.html || true
          cp ../logo.png build/web/logo.png || true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages sometimes stalls after syncing files; wait longer and retry once
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1800000
      - name: Wait before retrying Pages
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
