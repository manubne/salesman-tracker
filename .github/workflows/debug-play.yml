name: Debug Play auth
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-play.yml']
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Test Play service-account auth
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import os, json, sys
          raw = os.environ.get('SA_JSON', '')
          print("=== secret checks ===")
          print("secret length:", len(raw))
          print("starts with '{':", raw.strip().startswith('{'))
          print("ends with '}':", raw.strip().endswith('}'))
          try:
              info = json.loads(raw)
          except Exception as e:
              print("JSON PARSE ERROR:", repr(e))
              sys.exit(0)
          print("client_email:", info.get('client_email'))
          print("project_id:", info.get('project_id'))
          pk = info.get('private_key', '')
          print("private_key ok:", pk.startswith('-----BEGIN') and pk.rstrip().endswith('PRIVATE KEY-----'))
          print("=== auth test ===")
          try:
              from google.oauth2 import service_account
              import google.auth.transport.requests as tr
              creds = service_account.Credentials.from_service_account_info(
                  info, scopes=['https://www.googleapis.com/auth/androidpublisher'])
              creds.refresh(tr.Request())
              print("TOKEN MINT: OK")
          except Exception as e:
              print("TOKEN MINT ERROR:", repr(e))
              sys.exit(0)
          print("=== Play API test (edits.insert) ===")
          import requests
          pkg = 'org.bne.salesman_tracker'
          r = requests.post(
              f'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}/edits',
              headers={'Authorization': 'Bearer ' + creds.token})
          print("HTTP status:", r.status_code)
          print("body:", r.text[:800])
          PY
